data:
  f0_extractor: 'rmvpe' # 'parselmouth', 'dio', 'harvest', 'crepe' or 'rmvpe'
  f0_min: 65 # about C2
  f0_max: 800 # about G5
  sampling_rate: 44100
  volume_smooth_size: 1024
  block_size: 512 # Equal to hop_length
  duration: 2 # Audio duration during training, must be less than the duration of the shortest audio clip
  encoder: 'contentvec768l12tta2x' # 'hubertsoft', 'contentvec768l12', 'contentvec768l12tta2x' or 'cnhubertsoftfish'
  cnhubertsoft_gate: 10
  encoder_sample_rate: 16000
  encoder_hop_size: 160 # 160 for 'contentvec768l12tta2x', 320 for any others
  encoder_out_channels: 768 # 256 if using 'hubertsoft'
  encoder_ckpt: pretrain/contentvec/pytorch_model.bin
  train_path: data/timbre_blend_stage1/train # Create a folder named "audio" under this path and put the audio clip in it
  valid_path: data/timbre_blend_stage1/val # Create a folder named "audio" under this path and put the audio clip in it
  extensions:
    - wav

model:
  type: 'RectifiedFlow'
  win_length: 2048
  n_aux_layers: 6
  n_aux_chans: 512
  n_layers: 6
  n_chans: 1024
  t_start: 0.0
  use_norm: true
  use_attention: false
  use_pitch_aug: true
  # Vocal Realism R0. Keep disabled to preserve upstream 6.3 behavior.
  realism:
    enabled: false
    strength: 1.0
    hidden_channels: 128
    num_layers: 2
    max_f0_cents: 35.0
    max_volume_db: 3.0
    checkpoint: null # optional standalone realism prior for staged training
  n_spk: 12 # max number of different speakers

device: cuda # training device

vocoder:
  type: 'nsf-hifigan'
  ckpt: 'pretrain/nsf_hifigan/model'

infer:
  infer_step: 50
  method: 'euler' # 'euler', 'rk4'

env:
  expdir: exp/timbre_blend_stage1
  gpu_id: 0

train:
  num_workers: 2
  amp_dtype: bf16
  batch_size: 48
  cache_all_data: true
  cache_device: 'cpu'
  cache_fp16: true
  epochs: 100000
  interval_log: 1
  # Validation cost controls (2026-09-27): full-pass validation over 345
  # slices (per-sample euler-50 infer + NSF vocoder + TB media logging) cost
  # ~10 min of CPU per run, and the loader pin_memory thread deadlocked the
  # WSL2 GPU driver during it. interval_val is aligned with
  # interval_force_save so every val checkpoint is kept.
  interval_val: 10000
  interval_force_save: 10000
  # val_max_batches: process only the first N validation batches as a
  #   deterministic subset (the val loader is shuffle=False). Absent or 0
  #   keeps the legacy full-pass behavior.
  # val_log_samples: cap heavy per-sample tensorboard media (spectrogram
  #   figure + gt/pred audio via librosa) to the first K samples. Absent
  #   keeps the legacy log-everything behavior.
  val_max_batches: 96
  val_log_samples: 3
  lr: 0.0005
  decay_step: 4000
  gamma: 0.9
  weight_decay: 0.1
  lambda_ddsp: 1
  # Timbre-blend Stage 2 knobs. Defaults preserve the legacy behavior exactly.
  # reflow_exclude_spk: 1-based speaker ids masked out of the reflow loss in
  #   training AND validation ([] = unmasked legacy path).
  # freeze_reflow: freeze all reflow_model weights (requires_grad=False) and
  #   keep them out of the optimizer; forward still runs.
  reflow_exclude_spk: []
  freeze_reflow: false
  # R2 staged training: timbre | realism_personalize | joint.
  # Public control-only prior training uses train_realism.py instead.
  realism_stage: timbre
  backbone_lr: 0.00005
  realism_lr: 0.0003
  resume_optimizer: true
  save_opt: false
